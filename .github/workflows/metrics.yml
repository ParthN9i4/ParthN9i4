name: Update GitHub Metrics

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Run on every push to main
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  metrics:
    name: Generate and commit metrics SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # Use the built-in GITHUB_TOKEN — no PAT required for these plugins
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ParthN9i4

          # Sections to include
          base: header, activity, community, repositories

          # Language breakdown
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_categories: markup, programming

          # Full-year contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Output settings
          filename: assets/metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"
          config_timezone: Asia/Kolkata
