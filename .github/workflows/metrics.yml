name: Update GitHub Metrics

on:
  schedule:
    - cron: '0 0 * * *'   # Daily at midnight UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  metrics:
    name: Generate metrics SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ParthN9i4

          # Layout: two-column compact view — keeps font sizes uniform
          config_display: columns
          config_timezone: Asia/Kolkata

          # Base sections: stats summary, recent activity, community, repos
          base: header, activity, community, repositories

          # Language breakdown (no byte sizes — percentage only for clarity)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # Output: commit SVG directly to main
          filename: assets/metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: refresh metrics [skip ci]"
